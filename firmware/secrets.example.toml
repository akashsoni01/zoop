# Copy to `secrets.toml` (gitignored) and fill in your values.
# Used at build time for WiFi and transcription API access.

wifi_ssid = "YOUR_WIFI_SSID"
wifi_pass = "YOUR_WIFI_PASSWORD"

# Transcription provider: "cursor" (dev) or "openai" (production).
transcription_provider = "cursor"

# Dev: Cursor user API key from cursor.com/dashboard → API Keys (format crsr_...).
cursor_api_key = "crsr_..."

# Production: OpenAI key for Whisper (optional when using cursor in dev).
openai_key = "sk-YOUR_OPENAI_KEY"

# Optional override for an OpenAI-compatible STT server (e.g. local Whisper proxy).
# Leave unset to use the provider default host (api.cursor.com or api.openai.com).
# transcription_base_host = "localhost:8000"

local_time_offset_min = 120  # UTC+2 (minutes east of UTC)
